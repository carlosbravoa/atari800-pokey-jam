# POKEY JAM .xex: POKEY PLAYER's panel and engine (MAIN, HIMEM, LOW2) with
# the composer in the song bank's place (SONG: code + style tables).
# Its variables sit above ($8B40-$9BFF) and at $0CA0-$10FF (not in the
# file), the event ring at
# $9C00-$9FFF. Overflow = link error.
MEMORY {
    HDR:   file = %O, start = $0000, size = $0006;
    MAIN:  file = %O, start = $2000, size = $1C00, define = yes;
    HDR2:  file = %O, start = $0000, size = $0004;
    HIMEM: file = %O, start = $4400, size = $0C00, define = yes;
    HDR3:  file = %O, start = $0000, size = $0004;
    SONG:  file = %O, start = $5000, size = $3E20, define = yes;
    HDR4:  file = %O, start = $0000, size = $0004;
    LOW2:  file = %O, start = $1400, size = $0400, define = yes;
    HDR5:  file = %O, start = $0000, size = $0004;
    JD2:   file = %O, start = $1C00, size = $0400, define = yes;   # old scope buffer B
    TRL:   file = %O, start = $0000, size = $0006;
    VARS:  file = "", start = $1100, size = $0300, define = yes;
    JVARS: file = "", start = $8E20, size = $0DE0, define = yes;
    JLOW:  file = "", start = $0C00, size = $0500, define = yes;   # the disk catalog's
    JLOW2: file = "", start = $0A40, size = $0100, define = yes;   # synth key log
    JLOW3: file = "", start = $0700, size = $0200, define = yes;   # loader pages
}
SEGMENTS {
    XEXHDR:  load = HDR,   type = ro;
    DLIST:   load = MAIN,  type = ro;
    CODE:    load = MAIN,  type = ro;
    RODATA:  load = MAIN,  type = ro;
    DATA:    load = VARS,  type = bss, optional = yes;
    XEXHDR2: load = HDR2,  type = ro;
    HIDATA:  load = HIMEM, type = ro, align = $100;
    JAMDATA3: load = HIMEM, type = ro;
    XEXHDR3: load = HDR3,  type = ro;
    JAMCODE: load = SONG,  type = ro;
    JAMDATA: load = SONG,  type = ro;
    XEXHDR4: load = HDR4,  type = ro;
    CODE2:   load = LOW2,  type = ro;
    XEXHDR5: load = HDR5,  type = ro;
    JAMDATA2: load = JD2,  type = ro;
    XEXTRL:  load = TRL,   type = ro;
    JAMBSS:  load = JVARS, type = bss;
    JAMCODE2: load = MAIN, type = ro;
    JAMBSS4: load = JLOW2, type = bss;
    JAMBSS2: load = JLOW,  type = bss;
    JAMBSS3: load = JLOW2, type = bss;
    JAMBSS5: load = JLOW3, type = bss;
}
